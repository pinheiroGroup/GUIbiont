name: Build & publish Docker image

# Publishes ghcr.io/pinheirogroup/guibiont. Users update by re-running run.sh /
# run.ps1, which does `docker pull` of :latest.
#
# Built for linux/amd64 and linux/arm64 so Apple Silicon Macs run natively
# instead of under qemu — Julia numerics are several times slower emulated.
# Each architecture builds on its own native runner (free for public repos) and
# pushes an untagged, digest-addressed image; the `merge` job then joins those
# digests into one multi-arch manifest list carrying the human-readable tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/pinheirogroup/guibiont

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Name this platform
        run: |
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # No tags here: a per-architecture image is not the thing users pull.
      # It is pushed by digest and referenced only by the manifest list below.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Separate cache scopes: one shared scope would have the two
          # architectures evicting each other's layers on every run.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `type=sha` is deliberately absent. It minted a permanent sha-<short>
      # tag on every push to main — 25 of them by v1.1.0, none referenced by
      # run.sh, each pinning ~1 GB of layers in package storage forever. The
      # commit is still recoverable from the image's
      # org.opencontainers.image.revision label, and any build stays reachable
      # by digest.
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect published image
        run: docker buildx imagetools inspect '${{ env.IMAGE }}:${{ steps.meta.outputs.version }}'

  # The per-architecture images and their attestations are untagged package
  # versions, so they pile up one build at a time. Prune the old ones; tagged
  # versions (latest, v*) are never touched.
  #
  # min-versions-to-keep is a safety margin, not a target: the untagged
  # versions backing the CURRENT manifest list must survive, or :latest breaks.
  # One build produces roughly four (two arches + two attestations), so 20
  # leaves about five builds of headroom.
  cleanup:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Prune untagged package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: guibiont
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 20
